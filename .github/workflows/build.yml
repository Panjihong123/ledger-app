name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      # 关键：用仓库里固定的证书替换 CI 临时生成的 debug 证书。
      # 这样每一次构建的签名都一致，新版本才能直接覆盖安装旧版本（不会丢数据）。
      - name: 安装固定签名证书
        run: |
          mkdir -p "$HOME/.android"
          cp signing/ledger.jks "$HOME/.android/debug.keystore"
          echo "=== 本次构建使用的签名指纹（每次都相同才算正常） ==="
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -i "SHA-256\|SHA256" || true

      - name: 用官方模板生成 Android 原生工程
        run: |
          flutter create --org com.pan.ledger --project-name ledger /tmp/ledgerapp

      - name: 用我们的源码覆盖
        run: |
          rm -rf /tmp/ledgerapp/lib
          cp -r lib /tmp/ledgerapp/lib
          cp pubspec.yaml /tmp/ledgerapp/pubspec.yaml

      - name: 设置中文 App 名称
        run: |
          sed -i 's/android:label="ledger"/android:label="记账软件"/' /tmp/ledgerapp/android/app/src/main/AndroidManifest.xml

      - name: 拉取依赖并构建 APK
        working-directory: /tmp/ledgerapp
        run: |
          flutter pub get
          # 版本名从 pubspec.yaml 读（如 1.1.0）；版本号用 CI 运行序号，保证每次递增
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          echo "构建版本：$VERSION_NAME  版本号：${{ github.run_number }}"
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number=${{ github.run_number }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ledger-app-release-apk
          path: /tmp/ledgerapp/build/app/outputs/flutter-apk/app-release.apk
